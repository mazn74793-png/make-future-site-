<body>

    <a data-nav href="index.html">الرئيسية</a>

<section class="section">
  <div class="container">
    <div class="panel" style="padding:22px">
      <h1 style="margin:0 0 6px">طلب تسجيل</h1>
      <p class="muted" style="margin:0">
        التسجيل <b>طلب مبدئي</b> — بعد الإرسال هيفتح واتساب برسالة جاهزة، وفريق Make Future هيتواصل لتأكيد المجموعة.
      </p>

      <div class="hr"></div>

      <form id="registerForm" class="form">
        <div class="field">
          <label class="small">اسم الطالب *</label>
          <input name="name" required placeholder="اكتب اسم الطالب" />
        </div>

        <div class="field">
          <label class="small">رقم ولي الأمر *</label>
          <input name="parent" type="tel" required placeholder="مثال: 01xxxxxxxxx" />
        </div>

        <div class="grid2">
          <div class="field">
            <label class="small">الصف *</label>
            <select name="grade" required>
              <option value="">اختر الصف</option>
              <option>1 ثانوي</option>
              <option>2 ثانوي</option>
              <option>3 ثانوي</option>
            </select>
          </div>

          <div class="field">
            <label class="small">المادة *</label>
            <select name="subject" required>
              <option value="">اختر المادة</option>
              <option>Math</option>
              <option>English</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="small">ملاحظات (اختياري)</label>
          <textarea name="notes" placeholder="مثال: عايز مجموعة مساء / محتاج تأسيس..."></textarea>
        </div>

        <button class="btn primary block" type="submit">إرسال الطلب</button>
        <div id="successMsg" class="success">✅ تم استلام طلبك — جاري فتح واتساب برسالة جاهزة.</div>
      </form>
    </div>
  </div>
</section>

<div class="floating">
  <a class="fab whatsapp" href="https://wa.me/201006693681" target="_blank" aria-label="واتساب">✆</a>

</div>

</body>
</html>
